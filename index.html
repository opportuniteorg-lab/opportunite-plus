<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPPORTUNITÉ plus</title>
<style>
    :root { --main: #0a3663; --accent: #00a651; }
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f6; animation: fadeIn 0.8s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .header { background: var(--main); color: white; padding: 25px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .solde-card { background: white; margin: 20px; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transform: scale(1); transition: 0.3s; }
    .solde-card:hover { transform: scale(1.02); }
    .amount { font-size: 2.5rem; font-weight: bold; color: var(--main); }
    .btn-container { display: flex; flex-direction: column; gap: 15px; padding: 20px; }
    .btn { padding: 18px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.4s; text-decoration: none; text-align: center; color: white; }
    .depot { background: var(--accent); }
    .retrait { background: var(--main); }
    .btn:active { transform: scale(0.95); }
    /* Animation de chargement */
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--main); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style></head>
<body>
    <div class="header"><h1>OPPORTUNITÉ plus</h1></div>
    <div class="solde-card">
        <div style="color: #888;">Solde Disponible</div>
        <div class="amount" id="solde">0 HTG</div>
    </div>
    <div class="btn-container">
        <a href="https://wa.me/50947011507?text=Bonjour,%20je%20veux%20effectuer%20un%20DÉPÔT" class="btn depot" onclick="loading()">Déposer</a>
        <a href="https://wa.me/50947011507?text=ALERTE%20RETRAIT:%20Je%20veux%20retirer%20mon%20argent" class="btn retrait" onclick="loading()">Retirer</a>
    </div>
    <div class="loader" id="loader"></div>
    <script>
        function loading() { document.getElementById('loader').style.display = 'block'; }
    </script>
</body></html>
