<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPPORTUNITÉ ➕</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0B192C; color: #FFFFFF; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    </style>
</head>
<body>
    <div id="loader">
        <h1>OPPORTUNITÉ ➕</h1>
        <p>Ansanm n'ap bati plis opòtinite pou yon demen miyò.</p>
    </div>
    <main>{{ .Content }}</main>
    <script>window.addEventListener("load", () => { document.getElementById("loader").style.display = "none"; });</script>
</body>
</html>
